name: CI Security Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Compile and lint
        run: make lint
      - name: Unit and integration tests
        run: make test
      - name: Local safety checks
        run: make security
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
